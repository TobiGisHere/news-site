name: Diagnose KI-Zugang (Entwicklung)

on:
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Zugriffe testen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/out; cd /tmp/out
          {
          echo "== models.github.ai"; curl -sS -i -X POST https://models.github.ai/inference/chat/completions \
            -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"Sag Hallo"}],"max_tokens":20}' | head -c 1500
          echo; echo "== catalog"; curl -sS -i https://models.github.ai/catalog/models -H "Authorization: Bearer $GH_TOKEN" | head -c 800
          echo; echo "== dns"; getent hosts models.github.ai models.inference.ai.azure.com translate.googleapis.com example.com
          echo "== env proxy"; env | grep -i proxy || true
          echo "== example.com"; curl -sS -o /dev/null -w "%{http_code}\n" https://example.com
          echo "== google translate"; curl -sS "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=de&dt=t&q=Ballistic%20helmet%20tender" | head -c 300
          } > diag.txt 2>&1
          git init -q -b probe-output; git add -A
          git -c user.name=probe -c user.email=probe@example.com commit -qm diag
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-output
