name: Quellen untersuchen (Entwicklung)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe.py scripts/probe_urls.txt /tmp/probe
      # Vorschau: kompletter Abruf mit dem Code dieses Branches, ohne die Live-Seite zu verändern
      - run: pip install -r requirements.txt && python scripts/fetch_news.py && cp site/data/news.json /tmp/probe/news.json
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
      - name: Ergebnis in Branch probe-output ablegen
        run: |
          cd /tmp/probe
          git init -q -b probe-output
          git add -A
          git -c user.name=probe -c user.email=probe@example.com commit -qm "probe"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-output
