name: News aktualisieren

on:
  schedule:
    # Stündlich zwischen ca. 6 und 23 Uhr deutscher Zeit. GitHub startet geplante Läufe nur nach Kapazität
    # und lässt bei neuen Repositories viele ausfallen; öfter planen gleicht das teilweise aus.
    - cron: "17 4-21 * * *"
  workflow_dispatch:            # manuell über "Run workflow"
    inputs:
      test_mail:
        description: "Wochen-Digest sofort als Test verschicken"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read
  models: read      # KI-Bewertung über GitHub Models (kostenlos)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Quellen abrufen
        run: python scripts/fetch_news.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}         # kostenlos über Google AI Studio
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional, kostenpflichtig
      - name: Mails (Sofortalarm, Wochen-Digest)
        run: python scripts/notify.py ${{ inputs.test_mail && '--digest' || '' }}
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
